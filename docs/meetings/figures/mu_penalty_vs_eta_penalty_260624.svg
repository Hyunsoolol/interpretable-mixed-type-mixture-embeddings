<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="58" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="34" font-weight="700" fill="#17212b">
    왜 mu가 아니라 eta에 패널티를 주는가?
  </text>
  <text x="800" y="96" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="21" fill="#52606d">
    핵심 차이: 방향벡터 자체를 줄이는가, posterior decision에 들어가는 contrast를 직접 선택하는가
  </text>

  <rect x="70" y="138" width="690" height="590" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
  <rect x="840" y="138" width="690" height="590" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="3"/>

  <text x="115" y="195" font-family="Malgun Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#9a3412">
    기존 sparse vMF: mu penalty
  </text>
  <text x="115" y="228" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" fill="#7c2d12">
    변수 선택 대상이 posterior decision parameter와 간접적으로 연결됨
  </text>

  <text x="885" y="195" font-family="Malgun Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#047857">
    제안 방법: Eta-group penalty
  </text>
  <text x="885" y="228" font-family="Malgun Gothic, Arial, sans-serif" font-size="19" fill="#065f46">
    posterior decision에 직접 들어가는 eta contrast를 선택함
  </text>

  <g font-family="Malgun Gothic, Arial, sans-serif">
    <rect x="122" y="270" width="575" height="62" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <text x="410" y="309" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">1. 패널티 대상: 방향벡터 mu_k</text>

    <line x1="410" y1="340" x2="410" y2="374" stroke="#f97316" stroke-width="4"/>
    <polygon points="410,386 400,368 420,368" fill="#f97316"/>

    <rect x="122" y="386" width="575" height="78" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <text x="410" y="416" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">2. unit-sphere 제약</text>
    <text x="410" y="446" text-anchor="middle" font-size="20" fill="#52606d">||mu_k||_2 = 1 이므로 좌표들이 함께 재조정됨</text>

    <line x1="410" y1="472" x2="410" y2="506" stroke="#f97316" stroke-width="4"/>
    <polygon points="410,518 400,500 420,500" fill="#f97316"/>

    <rect x="122" y="518" width="575" height="78" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <text x="410" y="548" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">3. kappa_k와 결합</text>
    <text x="410" y="578" text-anchor="middle" font-size="20" fill="#52606d">decision에는 eta_k = kappa_k mu_k 로 들어감</text>

    <line x1="410" y1="604" x2="410" y2="638" stroke="#f97316" stroke-width="4"/>
    <polygon points="410,650 400,632 420,632" fill="#f97316"/>

    <rect x="122" y="650" width="575" height="56" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
    <text x="410" y="685" text-anchor="middle" font-size="21" font-weight="700" fill="#9a3412">결과: 최적화와 변수 선택 해석이 간접적</text>
  </g>

  <g font-family="Malgun Gothic, Arial, sans-serif">
    <rect x="892" y="270" width="575" height="62" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="1180" y="309" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">1. natural parameter: eta_k = kappa_k mu_k</text>

    <line x1="1180" y1="340" x2="1180" y2="374" stroke="#10b981" stroke-width="4"/>
    <polygon points="1180,386 1170,368 1190,368" fill="#10b981"/>

    <rect x="892" y="386" width="575" height="78" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="1180" y="416" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">2. posterior decision score</text>
    <text x="1180" y="446" text-anchor="middle" font-size="20" fill="#52606d">(eta_k - eta_l)' x_i 가 cluster 구분에 직접 작동</text>

    <line x1="1180" y1="472" x2="1180" y2="506" stroke="#10b981" stroke-width="4"/>
    <polygon points="1180,518 1170,500 1190,500" fill="#10b981"/>

    <rect x="892" y="518" width="575" height="78" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
    <text x="1180" y="548" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">3. coordinate별 eta contrast 선택</text>
    <text x="1180" y="578" text-anchor="middle" font-size="20" fill="#52606d">lambda_eta sum_j ||c_.j||_2 로 group selection</text>

    <line x1="1180" y1="604" x2="1180" y2="638" stroke="#10b981" stroke-width="4"/>
    <polygon points="1180,650 1170,632 1190,632" fill="#10b981"/>

    <rect x="892" y="650" width="575" height="56" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="1180" y="685" text-anchor="middle" font-size="21" font-weight="700" fill="#047857">결과: cluster decision에 쓰이는 좌표를 직접 선택</text>
  </g>

  <rect x="150" y="760" width="1300" height="96" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="800" y="796" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2933">
    연구 claim
  </text>
  <text x="800" y="831" text-anchor="middle" font-family="Malgun Gothic, Arial, sans-serif" font-size="22" fill="#334155">
    Eta-group의 목표는 ARI 향상보다, clustering을 유지하면서 해석 가능한 sparse support를 회복하는 것이다.
  </text>
</svg>
