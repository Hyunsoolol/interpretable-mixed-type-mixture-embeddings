<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2933">
    Penalty Target in Sparse vMF Mixtures
  </text>
  <text x="800" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#52606d">
    mu penalty shrinks directions on the sphere; Eta-group penalizes posterior-decision contrasts.
  </text>

  <rect x="70" y="140" width="690" height="560" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="840" y="140" width="690" height="560" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <text x="115" y="195" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#334155">
    Penalty on direction vector mu
  </text>
  <text x="885" y="195" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#334155">
    Eta-group penalty
  </text>

  <circle cx="250" cy="360" r="118" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="250" cy="360" r="5" fill="#2563eb"/>
  <line x1="250" y1="360" x2="323" y2="285" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <polygon points="323,285 312,316 344,305" fill="#2563eb"/>
  <text x="312" y="276" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#1d4ed8">mu_k</text>
  <text x="169" y="513" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">unit sphere: ||mu_k||_2 = 1</text>

  <line x1="400" y1="300" x2="400" y2="420" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="400" cy="330" r="20" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <circle cx="400" cy="390" r="20" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <line x1="400" y1="350" x2="400" y2="370" stroke="#f97316" stroke-width="3"/>
  <text x="440" y="364" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#c2410c">kappa_k</text>
  <path d="M485 340 C540 290, 605 300, 640 350" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="8 7"/>
  <path d="M640 350 C605 410, 530 420, 485 380" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="505" y="455" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">constraint coupling</text>

  <text x="116" y="566" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334155">Penalty target: sum_j |mu_kj|</text>
  <text x="116" y="604" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334155">mu and kappa are coupled in the M-step</text>
  <text x="116" y="642" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334155">Decision score uses eta_k = kappa_k mu_k</text>

  <line x1="990" y1="500" x2="990" y2="265" stroke="#64748b" stroke-width="3"/>
  <line x1="990" y1="500" x2="1240" y2="500" stroke="#64748b" stroke-width="3"/>
  <polygon points="990,265 980,286 1000,286" fill="#64748b"/>
  <polygon points="1240,500 1221,490 1221,510" fill="#64748b"/>
  <line x1="990" y1="500" x2="1110" y2="370" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <polygon points="1110,370 1079,380 1102,402" fill="#0f766e"/>
  <line x1="990" y1="500" x2="1190" y2="430" stroke="#0ea5e9" stroke-width="7" stroke-linecap="round"/>
  <polygon points="1190,430 1158,426 1172,456" fill="#0ea5e9"/>
  <line x1="990" y1="500" x2="1090" y2="285" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>
  <polygon points="1090,285 1064,307 1097,319" fill="#7c3aed"/>
  <text x="1124" y="365" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f766e">eta_1</text>
  <text x="1202" y="430" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0284c7">eta_2</text>
  <text x="1102" y="278" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#6d28d9">eta_3</text>

  <rect x="1285" y="280" width="115" height="190" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <line x1="1308" y1="320" x2="1377" y2="320" stroke="#10b981" stroke-width="5"/>
  <line x1="1308" y1="375" x2="1377" y2="375" stroke="#10b981" stroke-width="5"/>
  <line x1="1308" y1="430" x2="1377" y2="430" stroke="#10b981" stroke-width="5"/>
  <text x="1342" y="513" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#047857">coordinate group</text>

  <text x="885" y="566" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334155">Natural parameter: eta_k = kappa_k mu_k</text>
  <text x="885" y="604" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334155">Decision depends directly on eta contrasts</text>
  <text x="885" y="642" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#334155">Penalty target: lambda_eta sum_j ||c_.j||_2</text>

  <rect x="150" y="720" width="1300" height="150" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="800" y="755" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1f2933">
    Takeaway
  </text>
  <text x="800" y="798" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">
    mu penalty: sparse direction under spherical constraint  |  eta penalty: sparse posterior-decision contrast
  </text>
  <text x="800" y="833" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#52606d">
    Main claim: interpretable sparse support with clustering preserved, not primarily higher ARI.
  </text>
</svg>
